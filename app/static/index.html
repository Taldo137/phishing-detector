<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Scripts only from this server. Inline styles are allowed for the <style> block below. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Email Phishing Detector</title>
  <link rel="icon" href="data:,">
  <script src="app.js" defer></script>
  <style>
    :root {
      --bg: #f4f6f9; --surface: #fff; --text: #1c2430; --muted: #5d6878; --border: #dde2ea; --accent: #2557d6;
      --low: #1e8e4e; --low-bg: #e3f5ea; --medium: #b45f06; --medium-bg: #fdf0dc;
      --high: #c62828; --high-bg: #fde4e4; --critical: #7b1fa2; --critical-bg: #f3e3f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161d; --surface: #1b212b; --text: #e6eaf0; --muted: #9aa5b5; --border: #2d3542; --accent: #5b8cff;
        --low: #4cc985; --low-bg: #16301f; --medium: #f0a64a; --medium-bg: #35260f;
        --high: #ff6b6b; --high-bg: #3a1a1c; --critical: #d48cf0; --critical-bg: #2e1a38;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
    main, header, footer { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
    header { padding-top: 24px; }
    h1 { font-size: 1.5rem; margin: 0; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin: 16px 0; }
    textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
               color: var(--text); font: 13px/1.45 ui-monospace, Consolas, monospace; }
    button { font: inherit; border-radius: 8px; border: 1px solid transparent; padding: 8px 16px; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    .primary { background: var(--accent); color: #fff; font-weight: 600; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
    .error { color: var(--high); margin: 0; }
    .badge { padding: 8px 16px; border-radius: 10px; font-size: 1.1rem; font-weight: 800; }
    .pill { padding: 1px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
    .risk-LOW, .sev-INFO, .label-safe { background: var(--low-bg); color: var(--low); }
    .risk-MEDIUM, .sev-MEDIUM { background: var(--medium-bg); color: var(--medium); }
    .risk-HIGH, .sev-HIGH, .label-phishing { background: var(--high-bg); color: var(--high); }
    .sev-CRITICAL { background: var(--critical-bg); color: var(--critical); }
    .sev-LOW { border: 1px solid var(--border); color: var(--muted); }
    .trust { color: var(--low); font-weight: 600; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }
    .num { text-align: right; white-space: nowrap; }
    .evidence { font: 12.5px ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
    #history-body tr { cursor: pointer; }
    #history-body tr:hover { background: var(--bg); }
  </style>
</head>
<body>
  <header>
    <h1>Email Phishing Detector</h1>
    <p class="muted">Static analysis only: links and attachments in the email are never opened.</p>
  </header>

  <main>
    <section class="card">
      <h2>Scan an email</h2>
      <form id="scan-form">
        <p><input type="file" id="file-input" accept=".eml,.txt,.msg"></p>
        <textarea id="email-text" rows="8" spellcheck="false"
                  placeholder="...or paste the full email here (with headers if you have them)"></textarea>
        <div class="row">
          <p class="error" id="error" role="alert" hidden></p>
          <button type="submit" class="primary" id="scan-button">Scan</button>
        </div>
      </form>
    </section>

    <section class="card" id="result-card" hidden>
      <div class="row">
        <span class="badge" id="risk-badge"></span>
        <span><strong id="verdict"></strong> &middot; score <strong id="score"></strong>/100</span>
        <span class="muted" id="result-meta"></span>
      </div>
      <p><span class="muted">From:</span> <span id="result-from"></span><br>
         <span class="muted">Subject:</span> <span id="result-subject"></span></p>
      <p class="muted" id="no-findings" hidden>No indicators found.</p>
      <div class="table-wrap">
        <table id="findings-table">
          <thead><tr><th>Severity</th><th>Category</th><th>Indicator</th><th>Evidence</th><th class="num">Points</th></tr></thead>
          <tbody id="findings-body"></tbody>
        </table>
      </div>
      <div class="row">
        <span id="label-status" class="muted"></span>
        <span>
          <button type="button" class="label-phishing" id="label-phishing">Mark as phishing</button>
          <button type="button" class="label-safe" id="label-safe">Mark as safe</button>
        </span>
      </div>
    </section>

    <section class="card">
      <h2>Recent scans</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Time</th><th>Sender</th><th>Subject</th><th class="num">Score</th><th>Level</th><th>Label</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="muted">
    <p><span id="served-by"></span> &middot; API docs: <a href="/docs">/docs</a></p>
  </footer>
</body>
</html>
